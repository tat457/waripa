<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ジュースの果汁計算＆手動立式アプリ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=MUREN&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap');
        
        body {
            font-family: 'Zen Maru Gothic', sans-serif;
            background-color: #FFFBEB;
        }

        /* ジュースグラスの波アニメーション */
        .glass-container {
            position: relative;
            background: rgba(255, 255, 255, 0.6);
            border: 4px solid #78350F;
            border-top: none;
            border-radius: 0 0 24px 24px;
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
        }

        .liquid-juice {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            transition: height 0.6s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.4s;
        }

        .liquid-water {
            position: absolute;
            left: 0;
            right: 0;
            background-color: rgba(191, 219, 254, 0.5);
            transition: height 0.6s cubic-bezier(0.4, 0, 0.2, 1), bottom 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* カスタム入力スライダー */
        input[type=range] {
            accent-color: #F97316;
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen pb-12">

    <!-- ヘッダー -->
    <header class="bg-amber-500 text-white shadow-md py-4 px-6 mb-6">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <i class="fa-solid font-bold text-3xl fa-wine-glass-empty text-yellow-200"></i>
                <h1 class="text-xl md:text-2xl font-black tracking-wide">果汁％・割の計算＆立式ラボ</h1>
            </div>
            <span class="text-xs bg-amber-600 text-amber-100 font-bold px-3 py-1 rounded-full">手動で式を立ててみよう</span>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 gap-6">

        <!-- タブ切り替え -->
        <div class="flex bg-amber-200/60 p-1.5 rounded-2xl mb-6 shadow-inner">
            <button id="tab-calc" onclick="switchTab('calc')" class="flex-1 py-3 font-bold rounded-xl transition text-center shadow-sm bg-white text-amber-600">
                <i class="fa-solid fa-calculator mr-2"></i>① 式を立てて計算する
            </button>
            <button id="tab-drill" onclick="switchTab('drill')" class="flex-1 py-3 font-bold rounded-xl transition text-center text-slate-600 hover:text-amber-700">
                <i class="fa-solid fa-pen-ruler mr-2"></i>② 立式トレーニング（クイズ）
            </button>
        </div>

        <!-- ==================== TAB 1: 式を立てて計算する ==================== -->
        <div id="section-calc" class="grid grid-cols-1 md:grid-cols-12 gap-6">

            <!-- 左側：入力パネル -->
            <div class="md:col-span-7 space-y-6">

                <div class="bg-white p-6 rounded-3xl shadow-sm border border-amber-100">
                    <h2 class="text-lg font-bold text-amber-800 border-b border-amber-100 pb-2 mb-4 flex items-center">
                        <i class="fa-solid fa-sliders text-amber-500 mr-2"></i> 条件を設定する
                    </h2>

                    <!-- ジュースの種類 -->
                    <div class="mb-5">
                        <label class="block text-sm font-bold text-slate-600 mb-2">ジュースの種類（見た目）</label>
                        <div class="grid grid-cols-4 gap-2">
                            <button onclick="setFlavor('orange')" class="flavor-btn p-2 rounded-xl border-2 border-orange-400 bg-orange-50 text-orange-700 font-bold text-xs flex flex-col items-center gap-1 active">
                                <span class="text-xl">🍊</span>オレンジ
                            </button>
                            <button onclick="setFlavor('apple')" class="flavor-btn p-2 rounded-xl border-2 border-transparent bg-slate-100 text-slate-600 font-bold text-xs flex flex-col items-center gap-1">
                                <span class="text-xl">🍎</span>りんご
                            </button>
                            <button onclick="setFlavor('grape')" class="flavor-btn p-2 rounded-xl border-2 border-transparent bg-slate-100 text-slate-600 font-bold text-xs flex flex-col items-center gap-1">
                                <span class="text-xl">🍇</span>ぶどう
                            </button>
                            <button onclick="setFlavor('lemon')" class="flavor-btn p-2 rounded-xl border-2 border-transparent bg-slate-100 text-slate-600 font-bold text-xs flex flex-col items-center gap-1">
                                <span class="text-xl">🍋</span>レモン
                            </button>
                        </div>
                    </div>

                    <!-- ジュースの全体量 (ml) -->
                    <div class="mb-5">
                        <div class="flex justify-between items-center mb-1">
                            <label class="text-sm font-bold text-slate-700">ジュースの全体量 (ml)</label>
                            <span class="text-xs bg-slate-100 px-2 py-0.5 rounded text-slate-500 font-mono">10〜2000 ml</span>
                        </div>
                        <div class="flex items-center gap-3">
                            <input type="number" id="volume-input" value="500" min="1" max="5000" oninput="updateCalculation()" class="w-32 text-lg font-bold p-2.5 border-2 border-amber-300 rounded-xl focus:outline-none focus:border-amber-500 text-center">
                            <span class="font-bold text-slate-600">ml</span>
                            <input type="range" id="volume-slider" value="500" min="50" max="2000" step="10" oninput="syncVolume(this.value)" class="w-full h-2 bg-amber-100 rounded-lg appearance-none cursor-pointer">
                        </div>
                    </div>

                    <!-- 割合の入力方式切り替え（％ or 割） -->
                    <div class="mb-4">
                        <label class="block text-sm font-bold text-slate-700 mb-2">割合の指定方法</label>
                        <div class="flex gap-3 mb-3">
                            <label class="flex-1 flex items-center justify-center gap-2 p-2.5 border-2 border-amber-400 bg-amber-50 rounded-xl cursor-pointer text-sm font-bold text-amber-900" id="label-unit-percent">
                                <input type="radio" name="ratio-unit" value="percent" checked onchange="onUnitChange()" class="hidden">
                                <span>％（パーセント）</span>
                            </label>
                            <label class="flex-1 flex items-center justify-center gap-2 p-2.5 border-2 border-slate-200 rounded-xl cursor-pointer text-sm font-bold text-slate-600" id="label-unit-wari">
                                <input type="radio" name="ratio-unit" value="wari" onchange="onUnitChange()" class="hidden">
                                <span>割（わり）</span>
                            </label>
                        </div>
                    </div>

                    <!-- 果汁割合の値 -->
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label class="text-sm font-bold text-slate-700" id="ratio-label-text">果汁の割合 (％)</label>
                            <span id="ratio-hint" class="text-xs text-amber-600 font-bold">100% = 全体</span>
                        </div>
                        <div class="flex items-center gap-3">
                            <input type="number" id="ratio-input" value="30" step="0.1" min="0" max="100" oninput="updateCalculation()" class="w-32 text-lg font-bold p-2.5 border-2 border-amber-300 rounded-xl focus:outline-none focus:border-amber-500 text-center">
                            <span class="font-bold text-slate-600" id="ratio-unit-text">％</span>
                            <input type="range" id="ratio-slider" value="30" min="0" max="100" step="1" oninput="syncRatio(this.value)" class="w-full h-2 bg-amber-100 rounded-lg appearance-none cursor-pointer">
                        </div>
                    </div>

                </div>

                <!-- 立式ステップ（手動で式を組み立てる手順解説） -->
                <div class="bg-amber-50 border-2 border-amber-200 p-6 rounded-3xl space-y-4">
                    <h3 class="font-bold text-amber-900 flex items-center text-md">
                        <i class="fa-solid fa-lightbulb text-amber-500 mr-2 text-xl"></i> 式を立てるステップ
                    </h3>

                    <!-- ステップ1: 割合を少数/分数に変える -->
                    <div class="bg-white p-3.5 rounded-2xl border border-amber-100 shadow-sm text-sm">
                        <div class="font-bold text-slate-700 mb-1 flex items-center gap-2">
                            <span class="w-5 h-5 rounded-full bg-amber-500 text-white text-xs flex items-center justify-center">1</span>
                            割合を「倍率（小数）」に変換する
                        </div>
                        <p class="text-slate-600 text-xs ml-7 mb-2" id="step1-explain">
                            %は100を全体(1)とする単位です。
                        </p>
                        <div class="ml-7 bg-amber-50/80 p-2 rounded-xl text-center font-mono font-bold text-amber-900 border border-amber-200/60" id="step1-formula">
                            <!-- JSで更新 -->
                        </div>
                    </div>

                    <!-- ステップ2: 掛け算の式を作る -->
                    <div class="bg-white p-3.5 rounded-2xl border border-amber-100 shadow-sm text-sm">
                        <div class="font-bold text-slate-700 mb-1 flex items-center gap-2">
                            <span class="w-5 h-5 rounded-full bg-amber-500 text-white text-xs flex items-center justify-center">2</span>
                            全体量に倍率を掛ける式を立てる
                        </div>
                        <div class="ml-7 bg-amber-50/80 p-2 rounded-xl text-center font-mono font-bold text-amber-900 border border-amber-200/60" id="step2-formula">
                            <!-- JSで更新 -->
                        </div>
                    </div>

                    <!-- 手動計算フォーム -->
                    <div class="bg-white p-4 rounded-2xl border-2 border-amber-400 shadow-sm">
                        <label class="block text-xs font-bold text-amber-900 mb-2">
                            ✏️ 自分の手で計算してみよう！（電卓・筆算の練習）
                        </label>
                        <div class="flex items-center gap-2 flex-wrap">
                            <span id="user-calc-prefix" class="font-mono font-bold text-slate-700 text-sm">500 × 0.3 =</span>
                            <input type="number" id="user-answer-input" step="any" placeholder="答えを入力" class="w-28 p-2 text-center border-2 border-slate-300 rounded-xl font-bold focus:border-amber-500 focus:outline-none">
                            <span class="font-bold text-slate-600 text-sm">ml</span>
                            <button onclick="checkUserAnswer()" class="bg-amber-500 hover:bg-amber-600 active:scale-95 text-white font-bold px-4 py-2 rounded-xl text-sm transition">
                                答え合わせ
                            </button>
                            <button onclick="revealAnswer()" class="bg-slate-100 hover:bg-slate-200 active:scale-95 text-slate-600 font-bold px-3 py-2 rounded-xl text-xs transition">
                                答えを見る
                            </button>
                        </div>
                        <div id="user-answer-feedback" class="mt-2 text-xs font-bold hidden"></div>
                    </div>

                </div>

            </div>

            <!-- 右側：グラフィック＆計算結果表示 -->
            <div class="md:col-span-5 flex flex-col gap-6">

                <!-- 結果カード -->
                <div class="bg-amber-500 text-white p-6 rounded-3xl shadow-md text-center relative overflow-hidden">
                    <div class="text-amber-100 text-sm font-bold mb-1">計算された果汁含有量</div>
                    <div class="text-4xl md:text-5xl font-black tracking-tight my-2 font-mono" id="result-volume">
                        ？ <span class="text-2xl font-bold">ml</span>
                    </div>
                    <div class="text-xs bg-amber-600/60 inline-block px-3 py-1 rounded-full text-amber-100 font-medium" id="result-breakdown">
                        全体の 30% （答え合わせで詳細表示）
                    </div>
                </div>

                <!-- ジュースグラスのビジュアル -->
                <div class="bg-white p-6 rounded-3xl shadow-sm border border-amber-100 flex flex-col items-center flex-1 justify-center">
                    <div class="text-xs font-bold text-slate-400 mb-3">割合のイメージ</div>
                    
                    <!-- グラス本体 -->
                    <div class="glass-container w-36 h-64 relative border-slate-700">
                        <!-- 水分（上層） -->
                        <div id="glass-water" class="liquid-water"></div>
                        <!-- 果汁（下層） -->
                        <div id="glass-juice" class="liquid-juice bg-orange-400"></div>

                        <!-- グラスのメモリ（％） -->
                        <div class="absolute inset-y-0 right-1 flex flex-col justify-between text-[9px] font-mono font-bold text-slate-400 py-1 select-none pointer-events-none">
                            <span>100%</span>
                            <span>75%</span>
                            <span>50%</span>
                            <span>25%</span>
                            <span>0%</span>
                        </div>
                    </div>

                    <!-- グラス凡例 -->
                    <div class="flex items-center gap-4 mt-4 text-xs font-bold">
                        <div class="flex items-center gap-1.5">
                            <span id="legend-juice-color" class="w-3.5 h-3.5 rounded-full bg-orange-400 inline-block"></span>
                            <span class="text-slate-700">果汁: <span id="legend-juice-val" class="font-mono">？</span>ml</span>
                        </div>
                        <div class="flex items-center gap-1.5">
                            <span class="w-3.5 h-3.5 rounded-full bg-blue-200 inline-block"></span>
                            <span class="text-slate-500">水など: <span id="legend-water-val" class="font-mono">？</span>ml</span>
                        </div>
                    </div>
                </div>

            </div>

        </div>

        <!-- ==================== TAB 2: 立式トレーニング ==================== -->
        <div id="section-drill" class="hidden">
            <div class="bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-amber-100 max-w-2xl mx-auto">
                <div class="flex items-center justify-between border-b border-amber-100 pb-4 mb-6">
                    <div>
                        <span class="text-xs font-bold bg-amber-100 text-amber-800 px-2.5 py-1 rounded-full">立式チャレンジ</span>
                        <h2 class="text-xl font-extrabold text-slate-800 mt-1">文章題から正しい式を作ろう！</h2>
                    </div>
                    <div class="text-right">
                        <div class="text-xs text-slate-400 font-bold">スコア</div>
                        <div class="text-2xl font-black text-amber-500 font-mono" id="drill-score">0 点</div>
                    </div>
                </div>

                <!-- 問題文表示エリア -->
                <div id="drill-question-box" class="bg-amber-50 p-5 rounded-2xl border-2 border-amber-200 mb-6">
                    <p class="text-slate-700 font-bold text-base md:text-lg leading-relaxed" id="drill-question-text">
                        問題文がここに表示されます。
                    </p>
                </div>

                <!-- 式の組み立てフォーム -->
                <div class="space-y-4 mb-6">
                    <label class="block text-xs font-bold text-slate-500">【ステップ1】割合を倍率（小数）に直すと？</label>
                    <div class="flex items-center gap-2">
                        <span id="drill-ratio-orig" class="font-bold text-slate-700 text-sm">30%</span>
                        <span class="text-slate-400">＝</span>
                        <input type="number" id="drill-decimal-input" step="0.01" placeholder="小数で入力" class="w-36 p-2.5 border-2 border-slate-300 rounded-xl font-bold text-center focus:border-amber-500 focus:outline-none">
                    </div>

                    <label class="block text-xs font-bold text-slate-500 pt-2">【ステップ2】果汁量を求める計算式と答えをつくろう</label>
                    <div class="flex items-center gap-2 flex-wrap font-bold text-slate-700">
                        <input type="number" id="drill-vol-input" step="any" placeholder="全体量" class="w-28 p-2.5 border-2 border-slate-300 rounded-xl text-center focus:border-amber-500 focus:outline-none">
                        <span>×</span>
                        <input type="number" id="drill-mult-input" step="any" placeholder="倍率(小数)" class="w-28 p-2.5 border-2 border-slate-300 rounded-xl text-center focus:border-amber-500 focus:outline-none">
                        <span>＝</span>
                        <input type="number" id="drill-ans-input" step="any" placeholder="果汁量(ml)" class="w-32 p-2.5 border-2 border-amber-400 rounded-xl text-center font-black focus:border-amber-500 focus:outline-none">
                        <span>ml</span>
                    </div>
                </div>

                <!-- ボタン・判定 -->
                <div class="flex gap-3">
                    <button onclick="checkDrillAnswer()" class="flex-1 bg-amber-500 hover:bg-amber-600 active:scale-95 text-white font-black py-3.5 rounded-2xl shadow-sm transition text-center">
                        回答する！
                    </button>
                    <button onclick="nextDrillQuestion()" class="bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold px-5 py-3.5 rounded-2xl transition">
                        次へ <i class="fa-solid fa-arrow-right ml-1"></i>
                    </button>
                </div>

                <!-- フィードバック表示 -->
                <div id="drill-feedback" class="mt-4 p-4 rounded-2xl hidden font-bold text-sm"></div>

            </div>
        </div>

    </main>

    <script>
        // ==================== 状態管理 ====================
        let currentFlavor = 'orange';
        let currentUnit = 'percent'; // 'percent' | 'wari'

        const flavorColors = {
            orange: { bg: '#FB923C', name: 'オレンジ' },
            apple:  { bg: '#EF4444', name: 'りんご' },
            grape:  { bg: '#A855F7', name: 'ぶどう' },
            lemon:  { bg: '#FACC15', name: 'レモン' }
        };

        // ==================== 初期化 ====================
        window.onload = function() {
            updateCalculation();
            initDrill();
        };

        // ==================== モード（タブ）切り替え ====================
        function switchTab(tab) {
            const calcTab = document.getElementById('tab-calc');
            const drillTab = document.getElementById('tab-drill');
            const calcSec = document.getElementById('section-calc');
            const drillSec = document.getElementById('section-drill');

            if (tab === 'calc') {
                calcTab.className = "flex-1 py-3 font-bold rounded-xl transition text-center shadow-sm bg-white text-amber-600";
                drillTab.className = "flex-1 py-3 font-bold rounded-xl transition text-center text-slate-600 hover:text-amber-700";
                calcSec.classList.remove('hidden');
                drillSec.classList.add('hidden');
            } else {
                drillTab.className = "flex-1 py-3 font-bold rounded-xl transition text-center shadow-sm bg-white text-amber-600";
                calcTab.className = "flex-1 py-3 font-bold rounded-xl transition text-center text-slate-600 hover:text-amber-700";
                drillSec.classList.remove('hidden');
                calcSec.classList.add('hidden');
            }
        }

        // ==================== 味・グラフィック変更 ====================
        function setFlavor(flavor) {
            currentFlavor = flavor;
            const btns = document.querySelectorAll('.flavor-btn');
            btns.forEach(btn => {
                btn.classList.remove('border-orange-400', 'bg-orange-50', 'text-orange-700', 'border-2');
                btn.classList.add('border-transparent', 'bg-slate-100', 'text-slate-600');
            });
            event.currentTarget.classList.remove('border-transparent', 'bg-slate-100', 'text-slate-600');
            event.currentTarget.classList.add('border-orange-400', 'bg-orange-50', 'text-orange-700', 'border-2');

            // 液体の色変更
            const juiceElem = document.getElementById('glass-juice');
            const legendElem = document.getElementById('legend-juice-color');
            juiceElem.style.backgroundColor = flavorColors[flavor].bg;
            legendElem.style.backgroundColor = flavorColors[flavor].bg;
        }

        // ==================== 割合単位の切り替え (% ↔ 割) ====================
        function onUnitChange() {
            const unit = document.querySelector('input[name="ratio-unit"]:checked').value;
            currentUnit = unit;

            const ratioInput = document.getElementById('ratio-input');
            const ratioSlider = document.getElementById('ratio-slider');
            const ratioUnitText = document.getElementById('ratio-unit-text');
            const ratioLabelText = document.getElementById('ratio-label-text');
            const ratioHint = document.getElementById('ratio-hint');

            const labelPercent = document.getElementById('label-unit-percent');
            const labelWari = document.getElementById('label-unit-wari');

            if (unit === 'percent') {
                ratioLabelText.innerText = "果汁の割合 (％)";
                ratioUnitText.innerText = "％";
                ratioHint.innerText = "100% = 全体";
                ratioSlider.max = 100;
                ratioSlider.step = 1;
                ratioInput.max = 100;
                ratioInput.value = 30;
                ratioSlider.value = 30;

                labelPercent.className = "flex-1 flex items-center justify-center gap-2 p-2.5 border-2 border-amber-400 bg-amber-50 rounded-xl cursor-pointer text-sm font-bold text-amber-900";
                labelWari.className = "flex-1 flex items-center justify-center gap-2 p-2.5 border-2 border-slate-200 rounded-xl cursor-pointer text-sm font-bold text-slate-600";
            } else {
                ratioLabelText.innerText = "果汁の割合 (割)";
                ratioUnitText.innerText = "割";
                ratioHint.innerText = "10割 = 全体";
                ratioSlider.max = 10;
                ratioSlider.step = 0.1;
                ratioInput.max = 10;
                ratioInput.value = 3;
                ratioSlider.value = 3;

                labelWari.className = "flex-1 flex items-center justify-center gap-2 p-2.5 border-2 border-amber-400 bg-amber-50 rounded-xl cursor-pointer text-sm font-bold text-amber-900";
                labelPercent.className = "flex-1 flex items-center justify-center gap-2 p-2.5 border-2 border-slate-200 rounded-xl cursor-pointer text-sm font-bold text-slate-600";
            }

            updateCalculation();
        }

        // ==================== 入力同期 ====================
        function syncVolume(val) {
            document.getElementById('volume-input').value = val;
            updateCalculation();
        }

        function syncRatio(val) {
            document.getElementById('ratio-input').value = val;
            updateCalculation();
        }

        // ==================== 正確な小数計算ヘルパー（四捨五入なし） ====================
        function exactMultiply(a, b) {
            const strA = a.toString();
            const strB = b.toString();
            const decA = (strA.split('.')[1] || '').length;
            const decB = (strB.split('.')[1] || '').length;
            const intA = Number(strA.replace('.', ''));
            const intB = Number(strB.replace('.', ''));
            return (intA * intB) / Math.pow(10, decA + decB);
        }

        function exactDivideRatio(val, unit) {
            const str = val.toString();
            const dec = (str.split('.')[1] || '').length;
            const intVal = Number(str.replace('.', ''));
            const extraDec = unit === 'percent' ? 2 : 1;
            return intVal / Math.pow(10, dec + extraDec);
        }

        function exactSubtract(a, b) {
            const strA = a.toString();
            const strB = b.toString();
            const decA = (strA.split('.')[1] || '').length;
            const decB = (strB.split('.')[1] || '').length;
            const maxDec = Math.max(decA, decB);
            const factor = Math.pow(10, maxDec);
            return (Math.round(a * factor) - Math.round(b * factor)) / factor;
        }

        // ==================== 計算＆立式プロセスの更新 ====================
        function updateCalculation() {
            const vol = parseFloat(document.getElementById('volume-input').value) || 0;
            const ratioVal = parseFloat(document.getElementById('ratio-input').value) || 0;
            document.getElementById('volume-slider').value = Math.min(vol, 2000);
            document.getElementById('ratio-slider').value = ratioVal;

            // 1. 倍率（小数）の計算（四捨五入なし）
            const decimalRatio = exactDivideRatio(ratioVal, currentUnit);
            let step1Text = '';
            let step1Formula = '';

            if (currentUnit === 'percent') {
                step1Text = `「％」は 100 を全体(1)とする単位です。100 で割って小数にします。`;
                step1Formula = `${ratioVal}％ ÷ 100 ＝ ${decimalRatio}`;
            } else {
                step1Text = `「割」は 10 を全体(1)とする単位です。10 で割って小数にします。`;
                step1Formula = `${ratioVal}割 ÷ 10 ＝ ${decimalRatio}`;
            }

            // UI要素の更新（答えは隠した状態にする）
            document.getElementById('step1-explain').innerText = step1Text;
            document.getElementById('step1-formula').innerText = step1Formula;
            document.getElementById('step2-formula').innerText = `${vol} ml × ${decimalRatio} ＝ ？ ml`;
            document.getElementById('user-calc-prefix').innerText = `${vol} × ${decimalRatio} ＝`;

            // 結果表示（答えを隠す）
            document.getElementById('result-volume').innerHTML = `？ <span class="text-2xl font-bold">ml</span>`;
            const percentVal = currentUnit === 'percent' ? ratioVal : exactMultiply(ratioVal, 10);
            document.getElementById('result-breakdown').innerText = `全体の ${percentVal}% （答え合わせで詳細表示）`;

            // グラス描画の更新（割合の見た目のみ更新し、数値は隠す）
            const ratioPercentage = Math.min(100, Math.max(0, percentVal));
            document.getElementById('glass-juice').style.height = `${ratioPercentage}%`;
            document.getElementById('glass-water').style.height = `${100 - ratioPercentage}%`;
            document.getElementById('glass-water').style.bottom = `${ratioPercentage}%`;

            document.getElementById('legend-juice-val').innerText = '？';
            document.getElementById('legend-water-val').innerText = '？';

            // ユーザー手動入力欄とフィードバックのリセット
            document.getElementById('user-answer-input').value = '';
            document.getElementById('user-answer-feedback').classList.add('hidden');
        }

        // ==================== 答えを画面に表示する ====================
        function revealAnswer() {
            const vol = parseFloat(document.getElementById('volume-input').value) || 0;
            const ratioVal = parseFloat(document.getElementById('ratio-input').value) || 0;
            const decimalRatio = exactDivideRatio(ratioVal, currentUnit);
            const juiceVol = exactMultiply(vol, decimalRatio);
            const waterVol = Math.max(0, exactSubtract(vol, juiceVol));
            const percentVal = currentUnit === 'percent' ? ratioVal : exactMultiply(ratioVal, 10);

            document.getElementById('step2-formula').innerText = `${vol} ml × ${decimalRatio} ＝ ${juiceVol} ml`;
            document.getElementById('result-volume').innerHTML = `${juiceVol} <span class="text-2xl font-bold">ml</span>`;
            document.getElementById('result-breakdown').innerText = `全体の ${percentVal}% （水分等: ${waterVol} ml）`;
            document.getElementById('legend-juice-val').innerText = juiceVol;
            document.getElementById('legend-water-val').innerText = waterVol;
        }

        // ==================== ユーザーの手動計算の答え合わせ ====================
        function checkUserAnswer() {
            const userAns = parseFloat(document.getElementById('user-answer-input').value);
            const vol = parseFloat(document.getElementById('volume-input').value) || 0;
            const ratioVal = parseFloat(document.getElementById('ratio-input').value) || 0;
            const decimalRatio = exactDivideRatio(ratioVal, currentUnit);
            const correctAns = exactMultiply(vol, decimalRatio);

            const feedback = document.getElementById('user-answer-feedback');
            feedback.classList.remove('hidden');

            if (!isNaN(userAns) && Math.abs(userAns - correctAns) < 1e-9) {
                feedback.className = "mt-2 text-xs font-bold text-emerald-600 bg-emerald-50 p-2 rounded-xl border border-emerald-200";
                feedback.innerHTML = `<i class="fa-solid fa-circle-check mr-1"></i> 正解！大正解です！ 式：${vol} × ${decimalRatio} = ${correctAns} ml`;
                revealAnswer();
            } else {
                feedback.className = "mt-2 text-xs font-bold text-rose-600 bg-rose-50 p-2 rounded-xl border border-rose-200";
                feedback.innerHTML = `<i class="fa-solid fa-circle-xmark mr-1"></i> 惜しい！もう一度計算してみよう（または「答えを見る」で確認できます）`;
            }
        }

        // ==================== TAB 2: 立式トレーニング (クイズ) ====================
        let currentQuestion = null;
        let score = 0;

        function initDrill() {
            nextDrillQuestion();
        }

        function generateQuestion() {
            const flavors = ['オレンジジュース', 'りんごジュース', 'ぶどうジュース', 'グレープフルーツジュース'];
            const flavor = flavors[Math.floor(Math.random() * flavors.length)];
            const vol = (Math.floor(Math.random() * 18) + 2) * 50; // 100ml ~ 1000ml (50刻み)
            const isPercent = Math.random() > 0.3; // 70%の確率で%表示

            let ratioNum, ratioStr, unit, decimalVal;
            if (isPercent) {
                ratioNum = (Math.floor(Math.random() * 19) + 1) * 5; // 5% ~ 95%
                ratioStr = `${ratioNum}％`;
                unit = 'percent';
                decimalVal = exactDivideRatio(ratioNum, 'percent');
            } else {
                ratioNum = (Math.floor(Math.random() * 9) + 1); // 1割 ~ 9割
                ratioStr = `${ratioNum}割`;
                unit = 'wari';
                decimalVal = exactDivideRatio(ratioNum, 'wari');
            }

            const ans = exactMultiply(vol, decimalVal);

            return {
                text: `${vol} ml の${flavor}があります。このジュースの果汁割合は「 ${ratioStr} 」です。含まれている果汁は何 ml でしょうか？`,
                vol: vol,
                ratioStr: ratioStr,
                decimalVal: decimalVal,
                ans: ans
            };
        }

        function nextDrillQuestion() {
            currentQuestion = generateQuestion();
            document.getElementById('drill-question-text').innerText = currentQuestion.text;
            document.getElementById('drill-ratio-orig').innerText = currentQuestion.ratioStr;

            // 入力欄クリア
            document.getElementById('drill-decimal-input').value = '';
            document.getElementById('drill-vol-input').value = '';
            document.getElementById('drill-mult-input').value = '';
            document.getElementById('drill-ans-input').value = '';

            const feedback = document.getElementById('drill-feedback');
            feedback.classList.add('hidden');
        }

        function checkDrillAnswer() {
            const userDecimal = parseFloat(document.getElementById('drill-decimal-input').value);
            const userVol = parseFloat(document.getElementById('drill-vol-input').value);
            const userMult = parseFloat(document.getElementById('drill-mult-input').value);
            const userAns = parseFloat(document.getElementById('drill-ans-input').value);

            const feedback = document.getElementById('drill-feedback');
            feedback.classList.remove('hidden');

            const isStep1Correct = Math.abs(userDecimal - currentQuestion.decimalVal) < 1e-9;
            const isVolCorrect = userVol === currentQuestion.vol;
            const isMultCorrect = Math.abs(userMult - currentQuestion.decimalVal) < 1e-9;
            const isAnsCorrect = Math.abs(userAns - currentQuestion.ans) < 1e-9;

            if (isStep1Correct && isVolCorrect && isMultCorrect && isAnsCorrect) {
                score += 10;
                document.getElementById('drill-score').innerText = `${score} 点`;
                feedback.className = "mt-4 p-4 rounded-2xl font-bold text-sm bg-emerald-100 text-emerald-800 border-2 border-emerald-300";
                feedback.innerHTML = `
                    <div class="text-base font-extrabold mb-1"><i class="fa-solid fa-circle-check text-emerald-600 mr-2"></i>パーフェクト！大正解です！</div>
                    <div>立式: ${currentQuestion.vol} ml × ${currentQuestion.decimalVal} ＝ ${currentQuestion.ans} ml</div>
                `;
            } else {
                feedback.className = "mt-4 p-4 rounded-2xl font-bold text-sm bg-rose-100 text-rose-800 border-2 border-rose-300";
                let hints = [];
                if (!isStep1Correct) hints.push(`・ステップ1: ${currentQuestion.ratioStr} を少数に直すと ${currentQuestion.decimalVal} になります。`);
                if (!isVolCorrect || !isMultCorrect) hints.push(`・ステップ2の式: 【${currentQuestion.vol}】 × 【${currentQuestion.decimalVal}】 です。`);
                if (!isAnsCorrect) hints.push(`・果汁量の答え: 正解は ${currentQuestion.ans} ml です。`);

                feedback.innerHTML = `
                    <div class="text-base font-extrabold mb-1"><i class="fa-solid fa-circle-xmark text-rose-600 mr-2"></i>もう少し！チェックしてみよう</div>
                    <div class="text-xs space-y-1 font-normal">${hints.join('<br>')}</div>
                `;
            }
        }
    </script>
</body>
</html>
